services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jewellery_store
      MYSQL_USER: store
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      retries: 12
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_USERNAME: store
      DB_DATABASE: jewellery_store
    ports: ['8000:80']
    volumes: [store_data:/var/www/html/storage]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment: {DB_HOST: db, DB_USERNAME: store, DB_DATABASE: jewellery_store}
    command: php artisan queue:work --tries=3 --timeout=60
    volumes: [store_data:/var/www/html/storage]
    depends_on:
      db: {condition: service_healthy}
  scheduler:
    build: .
    env_file: .env
    environment: {DB_HOST: db, DB_USERNAME: store, DB_DATABASE: jewellery_store}
    command: /bin/sh -c 'while true; do php artisan schedule:run; sleep 60; done'
    volumes: [store_data:/var/www/html/storage]
    depends_on:
      db: {condition: service_healthy}
volumes:
  mysql_data:
  store_data:
